<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ASCI on the Office - Terminal Executive Game Compilation</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="crt-enabled">
  <!-- Overlay de Pánico "Boss Key" (Excel / Servidor Linux / SQL) -->
  <div id="boss-overlay" aria-hidden="true"></div>

  <div class="ascii-screen">
    <!-- Barra de Sistema Superior -->
    <header>
      <div class="bar-controls">
        <div class="bar-group">
          <button class="ascii-btn active" id="btn-home">[⌂ TERMINAL CENTRAL]</button>
          <button class="ascii-btn" id="btn-theme">[T] Monitor: Fósforo Verde</button>
          <button class="ascii-btn" id="btn-crt">[L] CRT: ON</button>
          <button class="ascii-btn" id="btn-audio">[Sonido: ON ♪]</button>
        </div>
        <div class="bar-group">
          <button class="ascii-btn boss-btn" id="btn-boss">[!JEFE CERCA! (F9 / TAB)]</button>
          <span class="ascii-secondary">│ RELOJ: <b id="office-clock">--:--:--</b></span>
        </div>
      </div>
    </header>

    <!-- Viewport Principal (Menú o Juego Activo) -->
    <main id="main-viewport"></main>

    <!-- Barra de Estado Inferior -->
    <footer class="bottom-bar">
      <div class="bar-controls">
        <span>OFFICE-DOS v4.20 │ 100% PURE ASCII RENDERING ENGINE</span>
        <span>[F9 / TAB]: Ocultar Juego (Modo Excel/Consola) │ [ESC]: Menú Principal</span>
      </div>
    </footer>
  </div>

  <!-- Scripts de la compilación -->
  <script src="js/audio.js"></script>
  <script src="js/boss.js"></script>
  <script src="js/games/sudoku.js"></script>
  <script src="js/games/minesweeper.js"></script>
  <script src="js/games/snake.js"></script>
  <script src="js/games/tetris.js"></script>
  <script src="js/games/game2048.js"></script>
  <script src="js/games/wordoffice.js"></script>
  <script src="js/games/solitaire.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
